<div id="panel-krti-mode" style="display:none; flex-direction: column; height: auto; box-sizing: border-box;">

    <!-- CARD UTAMA (JUDUL & GRAFIK) -->
    <div class="section-card"
        style="box-sizing: border-box; padding: 12px 14px 10px 14px; margin-bottom: 12px; flex: none; height: 240px;">
        <div class="section-title" style="margin-bottom: 12px; flex-shrink: 0;">KRTI AUTONOMOUS <span
                style="color:var(--apple-green)" id="krti-status-badge">STANDBY</span></div>

        <!-- GRAFIK (DIATAS) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 0;">
            <div
                style="background: #060c18; border: 1px solid var(--border-soft); border-radius: 8px; padding: 6px 10px; position: relative; height: 100%; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column;">
                <div
                    style="font-size: 12px; font-weight: bold; color: var(--apple-blue); text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 3px;">
                    <span>Altitude</span>
                    <span id="chart-alt-val" style="font-family:'JetBrains Mono'; font-size: 13px;">0.00 M</span>
                </div>
                <div style="flex: 1; min-height: 0; position: relative; width: 100%;">
                    <canvas id="chart-altitude" style="width: 100%; height: 100%;"></canvas>
                </div>
            </div>
            <div
                style="background: #060c18; border: 1px solid var(--border-soft); border-radius: 8px; padding: 6px 10px; position: relative; height: 100%; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column;">
                <div
                    style="font-size: 12px; font-weight: bold; color: var(--apple-orange); text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 3px;">
                    <span>Speed</span>
                    <span id="chart-speed-val" style="font-family:'JetBrains Mono'; font-size: 13px;">0.00 M/S</span>
                </div>
                <div style="flex: 1; min-height: 0; position: relative; width: 100%;">
                    <canvas id="chart-speed" style="width: 100%; height: 100%;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Action Buttons Row (ARM, START AUTO, LAND, CUTOFF) -->
    <div style="display: flex; gap: 4px; width: 100%; box-sizing: border-box; margin-top: 0; padding: 0; flex-shrink: 0;">
        <button class="action-btn btn-blue" onclick="sendManualAction('arm')"
            style="flex: 1; min-width: 0; height: 34px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Arm Vehicle">ARM</button>
        <button class="action-btn btn-disabled" id="krti-start-btn" onclick="sendKrtiAction('start_auto')" disabled="disabled"
            style="flex: 1; min-width: 0; height: 34px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap; background: #1e293b; color: #64748b; cursor: not-allowed; opacity: 0.7; border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease;" title="Start Auto Mission">START AUTO</button>
        <button class="action-btn btn-orange" id="krti-landing-btn" onclick="sendKrtiAction('landing')"
            style="flex: 1; min-width: 0; height: 34px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Land Vehicle">LAND</button>
        <button class="action-btn btn-danger" id="krti-cutoff-btn" onclick="sendKrtiAction('cutoff')"
            style="flex: 1; min-width: 0; height: 34px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Emergency Cutoff">CUTOFF</button>
    </div>

    <!-- ACTIVE WAYPOINT INDICATOR -->
    <div style="margin-top: 12px; background: #f8fafc; border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 10px rgba(15,23,42,0.05);">
        <span style="font-size: 11px; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px;">ACTIVE MISSION STEP</span>
        <span id="krti-active-wp-badge" style="font-size: 13px; font-weight: 800; color: var(--apple-orange); background: rgba(255, 107, 0, 0.15); border: 1px solid rgba(255, 107, 0, 0.4); padding: 5px 14px; border-radius: 8px; letter-spacing: 0.5px;">STANDBY</span>
    </div>
</div>
