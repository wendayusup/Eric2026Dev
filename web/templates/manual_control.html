<div class="section-card" id="panel-manual-control"
    style="flex: none; height: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
    <div class="section-title" style="margin-bottom: 2px;">MANUAL COMMAND</div>

    <!-- Main Action Buttons Row (ARM, TAKEOFF, LAND, CUTOFF) -->
    <div style="display: flex; gap: 4px; width: 100%; box-sizing: border-box; margin-top: 2px;">
        <button class="action-btn btn-blue" onclick="sendManualAction('arm')"
            style="flex: 1; min-width: 0; height: 32px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Arm Vehicle">ARM</button>
        <button class="action-btn btn-blue" onclick="sendTakeoffAction()"
            style="flex: 1; min-width: 0; height: 32px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Takeoff Vehicle">TAKEOFF</button>
        <button class="action-btn btn-orange" onclick="sendManualAction('land')"
            style="flex: 1; min-width: 0; height: 32px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Land Vehicle">LAND</button>
        <button class="action-btn btn-danger" onclick="sendManualAction('disarm')"
            style="flex: 1; min-width: 0; height: 32px; font-size: 10px; font-weight: 800; padding: 0; white-space: nowrap;" title="Emergency Disarm/Cutoff">CUTOFF</button>
    </div>

    <!-- Parameter Inputs Row -->
    <div style="display: flex; gap: 10px;">
        <div class="input-inline" style="flex: 1; margin-bottom: 0;">
            <label style="font-size: 11px; font-weight: 600; color: #0f172a;">Target Alt (m):</label>
            <input type="number" class="apple-input" id="manual-alt" value="1" min="1"
                style="width: 55px; padding: 4px 6px; font-size: 12px; background: #ffffff; border: 1px solid var(--border-soft); color: #0f172a; font-weight: 400;">
        </div>
        <div class="input-inline" style="flex: 1; margin-bottom: 0;">
            <label style="font-size: 11px; font-weight: 600; color: #0f172a;">Speed (m/s):</label>
            <input type="number" class="apple-input" id="manual-speed" value="1" min="0.5" max="10" step="0.5"
                style="width: 55px; padding: 4px 6px; font-size: 12px; background: #ffffff; border: 1px solid var(--border-soft); color: #0f172a; font-weight: 400;">
        </div>
    </div>

    <!-- Flight Mode Dropdown Row -->
    <div style="display: flex; gap: 10px; align-items: center; margin-top: 2px;">
        <div class="input-inline" style="flex: 1; margin-bottom: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; width: 100%;">
            <label style="font-size: 11px; font-weight: 600; color: #0f172a; white-space: nowrap;">Flight Mode:</label>
            <select class="apple-input" id="flight-mode-select" onchange="changeFlightMode(this.value)"
                style="flex: 1; padding: 4px 6px; font-size: 12px; height: 26px; border-radius: 6px; background: #ffffff; border: 1px solid var(--border-soft); color: #0f172a; font-weight: 400;">
                <option value="STABILIZE" selected>STABILIZE</option>
                <option value="ALT_HOLD">ALT_HOLD</option>
                <option value="LOITER">LOITER</option>
                <option value="GUIDED">GUIDED</option>
                <option value="RTL">RTL</option>
                <option value="LAND">LAND</option>
            </select>
        </div>
    </div>

    <!-- Target Coordinates Box -->
    <div class="target-coords-box"
        style="padding: 8px 12px; margin-top: 2px; min-height: 38px; display: flex; flex-direction: row; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border-soft); box-sizing: border-box; width: 100%;">
        <span style="font-weight: 700; font-size: 11px; color: #0f172a;">Map Target:</span>
        <b id="manual-target-coords"
            style="color:var(--apple-orange); font-size:12px; font-family: 'JetBrains Mono', monospace;">-</b>
    </div>

    <!-- Action Buttons Grid -->
    <div class="grid-buttons" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 2px;">
        <button class="action-btn btn-green" id="btn-upload-manual" onclick="triggerUploadProcess('manual')"
            style="height: 32px; font-size: 11px; font-weight: 700; grid-column: span 1; padding: 0; display: flex; align-items: center; justify-content: center; position: relative;">
            <div class="upload-progress" id="prog-manual"></div>
            <span style="position:relative; z-index:2;" id="txt-manual">UPLOAD TARGET</span>
        </button>
        <button class="action-btn" onclick="sendManualAction('hold')"
            style="height: 32px; font-size: 11px; font-weight: 700; grid-column: span 1; background: #0f172a; color: #ffffff; border: 1px solid #0f172a; box-shadow: 0 2px 6px rgba(15,23,42,0.2);">HOLD / LOITER</button>
    </div>

    <!-- Servo Control Section (DUAL SERVO OPEN / CLOSE) -->
    <div
        style="margin-top: 4px; border-top: 1px solid var(--border-soft); padding-top: 8px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px;">SERVO CONTROL:</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
            <button class="action-btn" onclick="testBothServos('open')"
                style="height: 32px; font-size: 12px; font-weight: 800; grid-column: span 1; background: var(--apple-orange); color: #ffffff; border: 1px solid var(--apple-orange); box-shadow: 0 4px 12px rgba(255, 107, 0, 0.35);">OPEN</button>
            <button class="action-btn" onclick="testBothServos('close')"
                style="height: 32px; font-size: 12px; font-weight: 800; grid-column: span 1; background: #142442; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 2px 6px rgba(0,0,0,0.2);">CLOSE</button>
        </div>
    </div>

</div>
